<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- SOLO 2 TIPOGRAFÍAS -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<style>

:root {
  --bg: #2f4c3b;
  --surface: #243a2e;
  --text: #e6e6e6;
  --accent: #a68a64;
}

/* BASE */
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Poppins', sans-serif;
}

/* TITULO */
h1 {
  font-family: 'JetBrains Mono', monospace;
  font-size: 28px;
  text-align: center;
  margin: 60px 0 10px;
  color: var(--accent);
}

/* SUBTITULO */
p {
  text-align: center;
  color: #cbd5e1;
  margin-bottom: 40px;
  font-size: 13px;
  letter-spacing: 2px;
}

/* GALERIA */
.gallery {
  max-width: 1000px;
  margin: auto;
}

/* ITEM */
.item {
  position: relative;
  overflow: hidden;
  border-radius: 16px;
  background: var(--surface);
}

/* IMAGEN */
.item img {
  width: 100%;
  aspect-ratio: 1/1;
  object-fit: cover;
  transition: 0.5s ease;
}

/* HOVER */
.item:hover img {
  transform: scale(1.08);
  filter: brightness(0.8);
}

/* OVERLAY TECH */
.item::after {
   content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.3);
  opacity: 0;
  transition: 0.3s;
}

.item:hover::after {
  opacity: 1;
}

/* ANIMACION */
.item {
  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 0.7s ease forwards;
}

.item:nth-child(1){animation-delay:.1s;}
.item:nth-child(2){animation-delay:.2s;}
.item:nth-child(3){animation-delay:.3s;}
.item:nth-child(4){animation-delay:.4s;}
.item:nth-child(5){animation-delay:.5s;}
.item:nth-child(6){animation-delay:.6s;}

@keyframes fadeUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* MODAL */
.modal-img {
  width: 100%;
  border-radius: 12px;
  transform: scale(0.8);
  transition: 0.4s;
}

.modal.show .modal-img {
  transform: scale(1);
}

</style>
</head>
