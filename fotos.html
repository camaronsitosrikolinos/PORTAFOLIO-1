<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Galería</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- FUENTE APPLE STYLE -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

:root {
  --bg: #0a0a0a;
  --surface: #111111;
  --text: #f5f5f7;
  --muted: #86868b;
}

/* BASE */
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
}

/* TITULOS */
h1 {
  font-size: 32px;
  font-weight: 600;
  letter-spacing: -0.5px;
  text-align: center;
  margin-bottom: 10px;
}

h2 {
  font-size: 14px;
  color: var(--muted);
  text-align: center;
  margin-bottom: 50px;
}

/* CONTENIDO */
.contenido {
  max-width: 900px;
  margin: 80px auto 40px;
  text-align: center;
}

/* GALERIA */
.gallery {
  max-width: 1000px;
  margin: auto;
}

/* ITEMS */
.item {
  position: relative;
  overflow: hidden;
  border-radius: 16px;
  background: var(--surface);
}

/* IMAGEN */
.item img {
  width: 100%;
  aspect-ratio: 1/1;
  object-fit: cover;
  transition: 0.5s ease;
}

/* HOVER PRO */
.item:hover img {
  transform: scale(1.08);
  filter: brightness(0.85);
}

/* OVERLAY SUAVE */
.item::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(transparent, rgba(0,0,0,0.5));
  opacity: 0;
  transition: 0.4s;
}

.item:hover::after {
  opacity: 1;
}

/* ANIMACION DE ENTRADA */
.item {
  opacity: 0;
  transform: translateY(30px);
  animation: fadeUp 0.8s ease forwards;
}

/* delay automático */
.item:nth-child(1){animation-delay: .1s;}
.item:nth-child(2){animation-delay: .2s;}
.item:nth-child(3){animation-delay: .3s;}
.item:nth-child(4){animation-delay: .4s;}
.item:nth-child(5){animation-delay: .5s;}
.item:nth-child(6){animation-delay: .6s;}

@keyframes fadeUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* MODAL */
.modal-img {
  width: 100%;
  border-radius: 12px;
  transform: scale(0.8);
  transition: 0.4s;
}

.modal.show .modal-img {
  transform: scale(1);
}

</style>
</head>

<body>
  <br>
  <br>


<div class="contenido">
  <h1>Gatos</h1>
  <h2>Hola</h2>

</div>

<div class="container gallery">
  <div class="row g-4">

    <div class="col-6 col-md-4 item">
      <img src="frida.JPG" onclick="openModal(this.src)">
    </div>

    <div class="col-6 col-md-4 item">
      <img src="leo.JPG" onclick="openModal(this.src)">
    </div>

    <div class="col-6 col-md-4 item">
      <img src="pelea.JPG" onclick="openModal(this.src)">
    </div>

    <div class="col-6 col-md-4 item">
      <img src="trufa.JPG" onclick="openModal(this.src)">
    </div>

    <div class="col-6 col-md-4 item">
      <img src="IMG_9685.JPG" onclick="openModal(this.src)">
    </div>

    <div class="col-6 col-md-4 item">
      <img src="Captura de pantalla 2026-04-21 225957.png" onclick="openModal(this.src)">
    </div>

  </div>
</div>

<!-- MODAL -->
<div class="modal fade" id="imgModal">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content bg-dark border-0">
      <div class="modal-body text-center">
        <img id="modalImage" class="modal-img">
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
function openModal(src){
  document.getElementById('modalImage').src = src;
  var modal = new bootstrap.Modal(document.getElementById('imgModal'));
  modal.show();
}
</script>
<br>
<br>
<br>
</body>
</html>
