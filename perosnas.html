<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Galería</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- TIPOGRAFIA PRO -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

:root {
  --bg: #1c1c1f;
  --surface: #24262f;
  --text: #f5f5f7;
  --muted: #9ca3af;
}

/* BASE */
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
}

/* CONTENIDO */
.contenido {
  text-align: center;
  margin: 60px 0 40px;
}

/* TITULO */
h1 {
  font-size: 28px;
  font-weight: 500;
  letter-spacing: -0.5px;
  margin-bottom: 10px;
}

/* SUBTITULO */
h2 {
  font-size: 13px;
  letter-spacing: 3px;
  color: var(--muted);
  margin-bottom: 50px;
  text-align: center;
}

/* GALERIA */
.gallery {
  max-width: 900px;
  margin: auto;
}

/* ITEM */
.item {
  position: relative;
  overflow: hidden;
  border-radius: 16px;
  background: var(--surface);
}

/* IMAGEN */
.item img {
  width: 100%;
  aspect-ratio: 1/1;
  object-fit: cover;
  transition: 0.5s ease;
}

/* HOVER */
.item:hover img {
  transform: scale(1.08);
  filter: brightness(0.85);
}

/* OVERLAY */
.item::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.3);
  opacity: 0;
  transition: 0.3s;
}

.item:hover::after {
  opacity: 1;
}

/* ANIMACION */
.item {
  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 0.6s ease forwards;
}

.item:nth-child(1){animation-delay:.1s;}
.item:nth-child(2){animation-delay:.2s;}
.item:nth-child(3){animation-delay:.3s;}
.item:nth-child(4){animation-delay:.4s;}

@keyframes fadeUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* MODAL */
.modal-img {
  width: 100%;
  border-radius: 12px;
  transform: scale(0.8);
  transition: 0.4s;
}

.modal.show .modal-img {
  transform: scale(1);
}

</style>
</head>

<body>

  <br>
  <br>


<div class="contenido">
  
</div>

<div class="container gallery">
  <div class="row g-4">

    <div class="col-6 item">
      <img src="1.png" onclick="openModal(this.src)">
    </div>

    <div class="col-6 item">
      <img src="3.png" onclick="openModal(this.src)">
    </div>

    <div class="col-6 item">
      <img src="2.png" onclick="openModal(this.src)">
    </div>

    <div class="col-6 item">
      <img src="4.png" onclick="openModal(this.src)">
    </div>

  </div>
</div>

<!-- MODAL -->
<div class="modal fade" id="imgModal">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content bg-dark border-0">
      <div class="modal-body text-center">
        <img id="modalImage" class="modal-img">
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
function openModal(src){
  document.getElementById('modalImage').src = src;
  var modal = new bootstrap.Modal(document.getElementById('imgModal'));
  modal.show();
}
</script>

<br>
<br>

</body>
</html>
