<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Galería</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- TIPOGRAFÍA ELEGANTE -->
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">

<style>

:root {
  --bg: #624853;
  --surface: #4b3640;
  --text: #f8f5f2;
  --muted: #d6cfc7;
  --accent: #f4a261;
}

/* BASE */
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Outfit', sans-serif;
}

/* CONTENIDO */
.contenido {
  text-align: center;
  margin: 80px 0 40px;
}

/* TITULO */
h1 {
  font-family: 'Playfair Display', serif;
  font-size: 42px;
  margin-bottom: 10px;
}

/* SUBTITULO */
h2 {
  font-size: 14px;
  letter-spacing: 3px;
  color: var(--muted);
  text-align: center;
  margin-bottom: 60px;
}
h3{
  font-size: 14px;
  letter-spacing: 3px;
  color: var(--muted);
  text-align: center;
  margin-bottom: 60px;
}

/* GALERIA */
.gallery {
  max-width: 1000px;
  margin: auto;
}

/* ITEM */
.item {
  position: relative;
  overflow: hidden;
  border-radius: 16px;
}

/* IMAGEN */
.item img {
  width: 100%;
  aspect-ratio: 1/1;
  object-fit: cover;
  transition: 0.5s ease;
}

/* HOVER */
.item:hover img {
  transform: scale(1.1);
  filter: brightness(0.85);
}

/* OVERLAY */
.item::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(transparent, rgba(0,0,0,0.5));
  opacity: 0;
  transition: 0.4s;
}

.item:hover::after {
  opacity: 1;
}

/* ANIMACION */
.item {
  opacity: 0;
  transform: translateY(25px);
  animation: fadeUp 0.7s ease forwards;
}

.item:nth-child(1){animation-delay:.1s;}
.item:nth-child(2){animation-delay:.2s;}
.item:nth-child(3){animation-delay:.3s;}
.item:nth-child(4){animation-delay:.4s;}
.item:nth-child(5){animation-delay:.5s;}
.item:nth-child(6){animation-delay:.6s;}

@keyframes fadeUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* MODAL */
.modal-img {
  width: 100%;
  border-radius: 12px;
  transform: scale(0.8);
  transition: 0.4s;
}

.modal.show .modal-img {
  transform: scale(1);
}

</style>
</head>

<body>

<div class="contenido">
  <h1>Pestañas</h1>
  <h2>Momentos capturados</h2>
</div>

<div class="container gallery">
  <div class="row g-4">

    <div class="col-6 col-md-4 item">
      <img src="IMG_9102.jpg" onclick="openModal(this.src)">
    </div>

    <div class="col-6 col-md-4 item">
      <img src="lololo.png" onclick="openModal(this.src)">
    </div>

    <div class="col-6 col-md-4 item">
      <img src="IMG_9155.jpg" onclick="openModal(this.src)">
    </div>

    <div class="col-6 col-md-4 item">
      <img src="3.jpg" onclick="openModal(this.src)">
    </div>

    <div class="col-6 col-md-4 item">
      <img src="IMG_9144.jpg" onclick="openModal(this.src)">
    </div>

    <div class="col-6 col-md-4 item">
      <img src="5.jpg" onclick="openModal(this.src)">
    </div>

  </div>
</div>

<!-- MODAL -->
<div class="modal fade" id="imgModal">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content bg-dark border-0">
      <div class="modal-body text-center">
        <img id="modalImage" class="modal-img">
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
function openModal(src){
  document.getElementById('modalImage').src = src;
  var modal = new bootstrap.Modal(document.getElementById('imgModal'));
  modal.show();
}
</script>

<br>
<br>
<h3>Hola chavales</h3>
<br>
<br>

</body>
</html>
