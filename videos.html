<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Galería Videos</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- TIPOGRAFÍA -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>

:root {
  --bg: #0b0f1a;
  --text: #f5f5f7;
  --muted: #9ca3af;
}

/* BASE */
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
}

/* TITULO */
h1 {
  text-align: center;
  margin: 60px 0 10px;
  font-size: 32px;
  font-weight: 500;
}

p {
  text-align: center;
  color: var(--muted);
  margin-bottom: 40px;
}

/* GALERIA */
.gallery {
  max-width: 1000px;
  margin: auto;
}

/* ITEM */
.item {
  position: relative;
  overflow: hidden;
  border-radius: 20px;
}

/* VIDEO */
video {
  width: 100%;
  aspect-ratio: 1/1;
  object-fit: cover;
  transition: 0.5s ease;
}

/* HOVER */
.item:hover video {
  transform: scale(1.08);
  filter: brightness(0.7);
}

/* OVERLAY PRO */
.overlay {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle, rgba(0,0,0,0.2), rgba(0,0,0,0.7));
  opacity: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: 0.4s;
}

.item:hover .overlay {
  opacity: 1;
}

/* BOTON PLAY */
.play-btn {
  width: 60px;
  height: 60px;
  border: 2px solid white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(5px);
  transition: 0.3s;
}


.item:hover .play-btn {
  transform: scale(1.2);
}

/* ANIMACION */
.item {
  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 0.8s ease forwards;
}

.item:nth-child(1){animation-delay:.1s;}
.item:nth-child(2){animation-delay:.2s;}

@keyframes fadeUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

</style>
</head>

<body>

<h1>Videos</h1>
<p>lolololo</p>

<div class="container gallery">
  <div class="row g-4">

    <!-- VIDEO 1 -->
    <div class="col-6 item">
      <video autoplay muted loop>
        <source src="videos/Secuencia 01.mp4" type="video/mp4">
      </video>
      <div class="overlay">
        <div class="play-btn"></div>
      </div>
    </div>

    <!-- VIDEO 2 -->
    <div class="col-6 item">
      <video autoplay muted loop>
        <source src="videos/bailando.mp4" type="video/mp4">
      </video>
      <div class="overlay">
        <div class="play-btn"></div>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
